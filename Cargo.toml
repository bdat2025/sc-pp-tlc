[package]
name = "telecloud_upload"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "telecloud_upload"
path = "src/main.rs"

[dependencies]
pp_utils = { path = "../pp_utils" }
reqwest = { version = "0.12", features = ["multipart", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
